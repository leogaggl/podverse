apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-descriptions-backfill
spec:
  # Manual ops only: suspended until an operator triggers a one-off Job. Rerunning is safe; each run
  # repairs rows without a preview and schedules up to -maxFeeds more reparses.
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes-excludes: "logs-volume"
        spec:
          containers:
            - name: worker
              image: ghcr.io/podverse/podverse/workers
              command:
                - "node"
                - "apps/workers/dist/index.js"
                - "ormDescriptionsBackfill"
                - "-enqueueReparse"
                - "-maxFeeds"
                - "200"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: podverse-workers-config
                - secretRef:
                    name: podverse-db-opaque
              volumeMounts:
                - name: logs-volume
                  mountPath: /logs
                - name: logs-volume
                  mountPath: /opt/logs
          volumes:
            - name: logs-volume
              emptyDir: {}
          restartPolicy: Never
