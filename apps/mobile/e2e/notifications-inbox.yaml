appId: com.podverse.app.next
name: Notifications Inbox
---
# Guest fill is a centered login CTA. After seed login, the inbox shell is reachable from More.

- runFlow: shared/launch-and-connect.yaml

# Signed out, the account event stream stays closed.
- assertVisible:
    id: notification-stream-e2e
    text: idle

- tapOn:
    id: tab-more
- tapOn:
    id: more-nav-notifications
- assertVisible:
    id: notifications-inbox-screen
- assertVisible:
    id: stack-header-back
- assertVisible:
    id: notifications-inbox-auth-required
- assertVisible:
    id: notifications-inbox-auth-required-action
- takeScreenshot: notifications-inbox-login-required

- runFlow: shared/login-seeded-user.yaml

# Signed in, the marker reads `open` once the stream's first event arrives. Nothing plays, so the
# background closes the stream and the return to the foreground opens a fresh one.
- extendedWaitUntil:
    visible:
      id: notification-stream-e2e
      text: open
    timeout: ${TIMEOUT_SLOW}
- pressKey: Home
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: notification-stream-e2e
      text: open
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: notifications-inbox-stream-reopened

- tapOn:
    id: tab-more
- tapOn:
    id: more-nav-notifications
- assertVisible:
    id: notifications-inbox-screen
- assertVisible:
    id: stack-header-back
- tapOn:
    id: stack-header-back
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-notifications
- assertVisible:
    id: notifications-inbox-screen
- takeScreenshot: notifications-inbox-initial

# Account-level subscribe defaults live under Settings, not the inbox. Back returns to
# the More menu.
- tapOn:
    id: stack-header-back
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-notifications
- assertVisible:
    id: more-settings-notifications-screen
- assertVisible:
    id: more-settings-notification-auto-enable-on-subscribe
- assertVisible:
    id: more-settings-notification-type-default-new-item
- assertVisible:
    id: more-settings-notification-type-default-livestream-scheduled
- assertVisible:
    id: more-settings-notification-type-default-livestream-started
- takeScreenshot: more-settings-notification-subscribe-defaults

# Toggle the subscribe default. When the account already follows podcasts, the apply dialog
# appears; keep existing rows (Only new) so the rest of the suite stays deterministic.
- tapOn:
    id: more-settings-notification-auto-enable-on-subscribe-switch
- runFlow:
    when:
      visible:
        id: more-settings-notifications-apply-dialog
    commands:
      - assertVisible:
          id: more-settings-notifications-apply-all
      - assertVisible:
          id: more-settings-notifications-apply-new-only
      - takeScreenshot: more-settings-notification-apply-dialog
      - tapOn:
          id: more-settings-notifications-apply-new-only
- assertVisible:
    id: more-settings-notifications-screen
- takeScreenshot: more-settings-notification-auto-enable-toggled

# Banner switches are stored on this device. They do not open the apply dialog. Livestream
# Scheduled starts off; the second tap leaves that default in place for the rest of this process.
- scrollUntilVisible:
    element:
      id: more-settings-banner-notification-livestream-scheduled-switch
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-banner-notifications-card
- assertVisible:
    id: more-settings-banner-notification-new-item-switch
- assertVisible:
    id: more-settings-banner-notification-livestream-started-switch
- tapOn:
    id: more-settings-banner-notification-livestream-scheduled-switch
- tapOn:
    id: more-settings-banner-notification-livestream-scheduled-switch
- assertNotVisible:
    id: more-settings-notifications-apply-dialog
- scrollUntilVisible:
    element:
      id: more-settings-banner-notification-general
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: more-settings-banner-notifications
