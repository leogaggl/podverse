appId: com.podverse.app.next
name: Change Password
---
# Settings changes this device's password and stays signed in.
# iOS and Android each use their own seeded account, change it, and change it back.
# The shared seeded account is not used. The opening script puts the stable password
# back when a previous run stopped after the first change.

- runFlow: shared/launch-and-connect.yaml

- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: scripts/auth-change-password.js
          env:
            E2E_ACCOUNT_EMAIL: "e2e-change-password-ios@example.com"
            E2E_ACCOUNT_PASSWORD: "Test!1Aa"
            E2E_ACCOUNT_TEMP_PASSWORD: "E2e-ios-pw2"
- runFlow:
    when:
      platform: Android
    commands:
      - runScript:
          file: scripts/auth-change-password.js
          env:
            E2E_ACCOUNT_EMAIL: "e2e-change-password-android@example.com"
            E2E_ACCOUNT_PASSWORD: "Test!1Aa"
            E2E_ACCOUNT_TEMP_PASSWORD: "E2e-and-pw2"

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: tab-more
      - assertVisible:
          id: more-screen
      - tapOn:
          id: anonymous-login-cta
      - assertVisible:
          id: login-screen
      - tapOn:
          id: login-email
      - inputText: "e2e-change-password-ios@example.com"
      - tapOn:
          id: login-password
      - inputText: "Test!1Aa"
      - tapOn:
          id: login-submit
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: tab-more
      - assertVisible:
          id: more-screen
      - tapOn:
          id: anonymous-login-cta
      - assertVisible:
          id: login-screen
      - tapOn:
          id: login-email
      - inputText: "e2e-change-password-android@example.com"
      - tapOn:
          id: login-password
      - inputText: "Test!1Aa"
      - hideKeyboard
      - tapOn:
          id: login-submit

- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: ${TIMEOUT_SLOW}
- extendedWaitUntil:
    visible:
      id: e2e-session-authenticated
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: tab-more
- tapOn:
    id: more-settings
- tapOn:
    id: more-settings-change-password
- extendedWaitUntil:
    visible:
      id: more-settings-change-password-screen
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: more-settings-change-password-current
- assertVisible:
    id: more-settings-change-password-new
- assertVisible:
    text: "Current Password"
- assertVisible:
    text: "New Password"
- assertNotVisible:
    text: "Confirm Password"
- assertNotVisible:
    text: "Show Password"
- takeScreenshot: auth-change-password-form

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: more-settings-change-password-current
      - inputText: "Test!1Aa"
      - tapOn:
          id: more-settings-change-password-new
      - inputText: "E2e-ios-pw2"
      - tapOn:
          id: more-settings-change-password-submit
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: more-settings-change-password-current
      - inputText: "Test!1Aa"
      - tapOn:
          id: more-settings-change-password-new
      - inputText: "E2e-and-pw2"
      - hideKeyboard
      - tapOn:
          id: more-settings-change-password-submit

- extendedWaitUntil:
    visible:
      id: more-settings-change-password-success
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: e2e-session-authenticated
- assertNotVisible:
    id: forced-logout-modal
- takeScreenshot: auth-change-password-changed

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: more-settings-change-password-current
      - inputText: "E2e-ios-pw2"
      - tapOn:
          id: more-settings-change-password-new
      - inputText: "Test!1Aa"
      - tapOn:
          id: more-settings-change-password-submit
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: more-settings-change-password-current
      - inputText: "E2e-and-pw2"
      - tapOn:
          id: more-settings-change-password-new
      - inputText: "Test!1Aa"
      - hideKeyboard
      - tapOn:
          id: more-settings-change-password-submit

- extendedWaitUntil:
    visible:
      id: more-settings-change-password-success
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: e2e-session-authenticated
- assertNotVisible:
    id: forced-logout-modal
- takeScreenshot: auth-change-password-restored

- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: scripts/auth-change-password.js
          env:
            E2E_ACCOUNT_EMAIL: "e2e-change-password-ios@example.com"
            E2E_ACCOUNT_PASSWORD: "Test!1Aa"
            E2E_ACCOUNT_TEMP_PASSWORD: "E2e-ios-pw2"
            E2E_CHANGE_PASSWORD_REPAIR_THROW: "1"
- runFlow:
    when:
      platform: Android
    commands:
      - runScript:
          file: scripts/auth-change-password.js
          env:
            E2E_ACCOUNT_EMAIL: "e2e-change-password-android@example.com"
            E2E_ACCOUNT_PASSWORD: "Test!1Aa"
            E2E_ACCOUNT_TEMP_PASSWORD: "E2e-and-pw2"
            E2E_CHANGE_PASSWORD_REPAIR_THROW: "1"
