appId: com.podverse.app.next
name: Search Flow
---
# Search query -> results -> result detail screenshots.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- assertVisible:
    id: search-input
- assertNotVisible:
    id: search-input-clear
- assertVisible:
    id: search-medium-all
- assertVisible:
    id: search-medium-music
- assertNotVisible:
    id: search-empty-query
- takeScreenshot: search-screen-initial

- tapOn:
    id: search-medium-music
- takeScreenshot: search-screen-music-chip

- tapOn:
    id: search-medium-all

- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-input-clear
- assertVisible:
    id: search-result-row-0
- takeScreenshot: search-screen-results

- tapOn:
    id: search-input-clear
- assertNotVisible:
    id: search-input-clear
- extendedWaitUntil:
    notVisible:
      id: search-result-row-0
    timeout: ${TIMEOUT_FASTEST}
# The X leaves search-input focused, so the next text does not tap the field first.
- inputText: podcast
- assertVisible:
    id: search-input-clear
- assertVisible:
    id: search-result-row-0

- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- takeScreenshot: search-screen-result-detail
