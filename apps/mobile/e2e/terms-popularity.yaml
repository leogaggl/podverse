appId: com.podverse.app.next
name: Terms Then Popularity
---
# Outdated terms and no popularity decision. Accepting terms shows popularity
# on the same screen, before the tab shell.

- runFlow: shared/launch-and-connect.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: anonymous-login-cta
- assertVisible:
    id: login-screen

- tapOn:
    id: login-email
- inputText: e2e-consent-order@example.com

- tapOn:
    id: login-password
- inputText: "Test!1Aa"

# Android often leaves the soft keyboard over Submit after inputText.
# iOS shows Submit above the keyboard and hideKeyboard is flaky there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn:
    id: login-submit

- extendedWaitUntil:
    visible:
      id: terms-acceptance-checkbox
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: terms-acceptance-screen

- tapOn:
    id: terms-acceptance-checkbox
- tapOn:
    id: terms-acceptance-accept

- extendedWaitUntil:
    visible:
      id: popularity-tracking-yes
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: popularity-tracking-prompt
- assertNotVisible:
    id: terms-acceptance-screen

- tapOn:
    id: popularity-tracking-no

- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: ${TIMEOUT_SLOW}
