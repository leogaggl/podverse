appId: com.podverse.app.next
name: Terms Then Taste Profile Consent
---
# Outdated terms and no Taste Profile consent decision. Accepting terms shows the Taste
# Profile consent prompt on the same screen, before the tab shell.

- runFlow: shared/launch-and-connect.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: anonymous-login-cta
- assertVisible:
    id: login-screen

- tapOn:
    id: login-email
- inputText: e2e-consent-order@example.com

- tapOn:
    id: login-password
- inputText: "Test!1Aa"

# Android often leaves the soft keyboard over Submit after inputText.
# iOS shows Submit above the keyboard and hideKeyboard is flaky there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard

- tapOn:
    id: login-submit

- extendedWaitUntil:
    visible:
      id: terms-acceptance-checkbox
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: terms-acceptance-screen

- tapOn:
    id: terms-acceptance-checkbox
- tapOn:
    id: terms-acceptance-accept

- extendedWaitUntil:
    visible:
      id: taste-profile-consent-yes
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: taste-profile-consent-prompt
- assertNotVisible:
    id: terms-acceptance-screen

- tapOn:
    id: taste-profile-consent-no

- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: ${TIMEOUT_SLOW}
