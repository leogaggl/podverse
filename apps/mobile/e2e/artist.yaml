appId: com.podverse.app.next
name: Artist flow
---
# Artist detail opens a verified album, the Not Yet Added preview, and a track.
# Track detail opens via More. Add on the preview is left alone so the seeded library stays put.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- openLink: podverse-next://artist/e2eMusicChnl01
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: artist-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- extendedWaitUntil:
    visible:
      id: artist-detail-sections
    timeout: ${TIMEOUT_SLOW}
# Albums, Tracks, and About are always in the chip row. Settings is the channel-header gear.
- assertVisible:
    id: artist-detail-header-settings
- assertNotVisible:
    id: artist-detail-section-settings
- extendedWaitUntil:
    visible:
      id: artist-detail-section-albums
    timeout: ${TIMEOUT_SLOW}
- extendedWaitUntil:
    visible:
      id: artist-detail-section-tracks
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: artist-detail-default

- tapOn:
    id: artist-detail-section-albums
- extendedWaitUntil:
    visible:
      id: artist-album-row-0
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: artist-albums-verified-heading
- assertNotVisible:
    text: "E2E Unclaimed Music Album"
- assertNotVisible:
    text: "E2E Unknown Album"
# The mini player can cover the bottom of the album list.
- scrollUntilVisible:
    element:
      id: artist-albums-not-yet-added-heading
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: artist-albums-not-yet-added-note
- assertVisible:
    id: artist-album-unadded-row-0
- tapOn:
    id: artist-album-row-0
- extendedWaitUntil:
    visible:
      id: album-detail-screen
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: artist-to-album-detail
# iOS returns with the stack edge swipe. Android uses the header back control.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "0%,45%"
          end: "85%,45%"
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: stack-header-back
- extendedWaitUntil:
    visible:
      id: artist-detail-screen
    timeout: ${TIMEOUT_SLOW}

- scrollUntilVisible:
    element:
      id: artist-album-unadded-row-0
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: artist-album-unadded-row-0
- extendedWaitUntil:
    visible:
      id: pi-feed-preview-screen
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    text: "E2E Not Yet Added Album"
- assertVisible:
    id: pi-feed-add-button
# Same return as the album round trip. Add follows the feed, so the flow does not press it.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "0%,45%"
          end: "85%,45%"
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: stack-header-back
- extendedWaitUntil:
    visible:
      id: artist-detail-screen
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: artist-detail-section-tracks
- extendedWaitUntil:
    visible:
      id: artist-track-row-0
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: artist-track-unadded-row-0
- assertVisible:
    text: "E2E Music Track One"
# Track Two can sit under the mini player. Scrolling is a no-op when it is already on screen.
- scrollUntilVisible:
    element:
      text: "E2E Music Track Two"
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "E2E Music Track Two"
- assertNotVisible:
    id: "home-row-play-.*"
- tapOn:
    id: "home-row-more-.*"
- extendedWaitUntil:
    visible:
      id: "media-row-menu-.*"
    timeout: ${TIMEOUT_FASTER}
- tapOn:
    id: "media-row-action-go-to-track-.*"
- extendedWaitUntil:
    visible:
      id: track-detail-screen
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: track-detail-playback-chrome
- takeScreenshot: artist-to-track-detail
