appId: com.podverse.app.next
name: Auto Queue Advance
---
# Full-player Next turns on once a later row is loaded, then skip keeps playback going.
#
# Opens e2ePodResume03 on e2ePodChnl001. That episode has no chapters, so Next's enabled
# state depends only on a later row. It is older than other episodes in the channel, so the
# pub-date forward fill has a newer episode to load. The seeded podcast queue also has
# upcoming rows, which enable Next on their own. The wait is for full-player-skip-next to
# be enabled. The tap is skipToNext, and playback stays active afterward.
#
# Seeded enclosures run 30s and 60s, past the Maestro timeout ladder (TIMEOUT_SLOWEST is 20s;
# see mobile-maestro-timeouts), so this flow does not wait for a natural ended event.
#
# Requires flow_needs_test_assets + flow_needs_e2e_api (real media + server queue/auto-queue).

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- openLink: podverse-next://podcast/e2ePodChnl001/episode/e2ePodResume03
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWER}

- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: mini-player
- tapOn:
    id: mini-player

- extendedWaitUntil:
    visible:
      id: full-player-skip-next
      enabled: true
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: auto-queue-advance-next-enabled

- tapOn:
    id: full-player-skip-next
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: auto-queue-advance-next-now-playing
